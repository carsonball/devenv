# Neovim with LazyVim. JSON, YAML, TOML, Markdown and git support are always on.
desc=Neovim + LazyVim with debugging (DAP), testing (neotest), JSON/YAML/TOML/Markdown/git
core=1
requires=cli
aliases=neovim vim lazyvim yaml yml json jsonc markdown md toml git .yaml .yml .json .md .toml
brew=neovim
extras=dap.core test.core lang.json lang.yaml lang.toml lang.markdown lang.git util.dot editor.inc-rename coding.mini-surround editor.harpoon2
