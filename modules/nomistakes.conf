desc=no-mistakes: git push gate that runs an AI review, tests and lint in a worktree, then opens the PR
aliases=no-mistakes nm
requires=claude
notes=Run `no-mistakes init` in a repo to gate it, then `git push no-mistakes`. init adds a git remote and a /no-mistakes skill that devenv doesn't track; `no-mistakes eject` takes a repo back out. Telemetry is off.
