desc=Docker: CLI, compose, buildx, lazydocker; Dockerfile LSP + hadolint; Colima runtime on macOS
aliases=dockerfile compose docker-compose container containers
requires=nvim
brew=docker:docker docker-compose docker-buildx lazydocker
brew_darwin=colima docker-credential-helper
extras=lang.docker
notes_darwin=Start the container runtime with `colima start` (size it with --cpu 4 --memory 8). Colima is used instead of Docker Desktop to avoid its license requirements on work machines.
notes_wsl=Action needed: the Docker daemon comes from Docker Desktop on Windows. In Docker Desktop, open Settings > Resources > WSL integration, turn on this distro and click Apply & restart. Then run `wsl --shutdown` in PowerShell, reopen the terminal and check with `docker ps`.
