# Claude Code (added by `devenv install claude`).
# prefix + C opens Claude in a popup, in the current pane's directory.
bind C display-popup -E -w 90% -h 90% -d "#{pane_current_path}" claude
# Pass Shift+Enter and friends through to programs that ask for them, so
# Shift+Enter adds a new line in Claude's prompt. (Ctrl+J always works.)
set -s extended-keys on
set -as terminal-features ",xterm*:extkeys,wezterm:extkeys"
