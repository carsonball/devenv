# tmux config written by devenv. Your own settings go in ~/.config/tmux/local.conf
# (sourced at the end, so it wins). Reload with prefix + r.

# --- basics ---------------------------------------------------------------
unbind C-b
set -g prefix C-a                 # Ctrl-a is easier to reach than Ctrl-b
bind C-a send-prefix              # press twice to send Ctrl-a to the program

set -g default-terminal "@@TMUX_TERM@@"
set -as terminal-features ",xterm-256color:RGB,wezterm:RGB,xterm-kitty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'                 # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g mouse on
set -g history-limit 100000
set -sg escape-time 10            # no lag on Esc in Neovim
set -g focus-events on            # lets Neovim reload files changed outside
set -g set-clipboard on           # OSC 52: yanks reach the system clipboard
set -g allow-passthrough on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off      # closing a session jumps to another one
set -g display-time 2000
setw -g aggressive-resize on

# --- keys -----------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Splits and new windows open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize with prefix + H/J/K/L (repeatable).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r m resize-pane -Z          # zoom toggle

# Alt-1..9 jumps to a window without the prefix.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Ctrl-h/j/k/l moves between panes and Neovim splits (pairs with vim-tmux-navigator).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l            # prefix + Ctrl-l still clears the screen

# Vi copy mode: prefix + [ then v to select, y to yank.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Popups.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind f display-popup -E -w 60% -h 60% tmux-sessionizer      # jump to a project
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind S command-prompt -p "new session:" "new-session -A -s '%%' -c '#{pane_current_path}'"
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# --- look (Tokyo Night) ---------------------------------------------------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold] #S #[bg=#16161e] "
set -g status-right "#{?client_prefix,#[fg=#ff9e64 bold]PREFIX ,}#[fg=#565f89]#{=40:pane_current_path} #[fg=#7aa2f7]%H:%M "
setw -g window-status-format "#[fg=#565f89] #I:#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-separator ""
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#16161e,fg=#7aa2f7"
set -g mode-style "bg=#283457"
set -g popup-border-style "fg=#7aa2f7"
set -g popup-border-lines rounded

# --- yours ----------------------------------------------------------------
if-shell "test -f ~/.config/tmux/local.conf" "source-file ~/.config/tmux/local.conf"
